name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_chart.cjs
      - run: node tests/test_treemap.cjs
      - run: node tests/test_watchlist_order.cjs
      - run: node tests/test_pixel_art.cjs
      - run: node tests/test_market_assets.cjs
      - run: bash -n install install-launcher uninstall
