name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_chart.cjs
      - run: node tests/test_treemap.cjs
      - run: node tests/test_watchlist_order.cjs
      - run: node tests/test_pixel_art.cjs
      - run: node tests/test_market_assets.cjs
      - run: bash -n install install-launcher uninstall
      - run: shellcheck install install-launcher uninstall
